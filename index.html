  const apd=k=>uid?sumY(allAbs.filter(z=>z.user_id==uid),k,s=>s=="approved"):0;
  h+=lEd==p.id?'<div class="scroll" style="margin-top:12px"><table>'+lEditRow(p,apd)+'</table></div>':'<button class="btn ol sm" style="margin-top:10px" onclick="lEd=\''+p.id+'\';lErr=\'\';draw()">Korrigjo ditët e pushimit (vjetor, mjekësor…)</button>';
  if(pay&&!pay.missing_base)h+='<h3 class="ovh">Llogaritja e pagës</h3><div class="ovrow"><span>Paga bazë'+(pay.monthly==null?' ('+x.shifts+' ditë × '+eur(pay.daily_rate)+')':'')+'</span><b>'+eur(pay.base_pay)+'</b></div><div class="ovrow"><span>Ditë extra: '+pay.extra_days+' × '+eur(pay.daily_rate)+'</span><b>'+eur(pay.extra_pay)+'</b></div><div class="ovrow"><span>Festa zyrtare: '+pay.holiday_days+' × '+eur(pay.daily_rate)+(pay.holiday_list?' <span class="mut">('+esc(pay.holiday_list)+')</span>':'')+'</span><b>'+eur(pay.holiday_pay)+'</b></div>'+(pay.unpaid_days?'<div class="ovrow"><span>Pushim mjekësor pa pagesë: '+pay.unpaid_days+' × '+eur(pay.daily_rate)+'</span><b style="color:var(--bad)">−'+eur(pay.unpaid_pay)+'</b></div>':'')+'<div class="ovrow tot"><span>Totali</span><b>'+eur(pay.total)+'</b></div>';
  h+='<h3 class="ovh">Ditët extra · '+mLabel(ovm)+'</h3>'+(x.extras.length?x.extras.map(e=>'<div class="ovrow"><b>'+e.day.split("-").reverse().join(".")+'</b><span><span class="oc sx" style="display:inline-block;padding:0 10px">'+esc(e.value)+'</span></span><span class="mut">'+(e.absence_id?'Nga kërkesa e miratuar':'Nga orari')+'</span></div>').join(""):'<p class="mut">Nuk ka ditë extra.</p>');
  h+='<h3 class="ovh">Pushimet · '+mLabel(ovm)+'</h3>'+(x.leaves.length?x.leaves.map(l=>'<div class="ovrow"><b>'+l.d.split("-").reverse().join(".")+'</b><span>'+esc(l.t)+'</span></div>').join(""):'<p class="mut">Nuk ka pushime këtë muaj.</p>');
  if(uid)h+='<h3 class="ovh">Kërkesat në aplikacion · '+yr+'</h3>'+(reqs.length?reqs.map(e=>entry(e,false)).join(""):'<p class="mut">Nuk ka kërkesa.</p>');
  else h+='<p class="mut" style="font-size:12px;margin-top:12px">Lidheni me llogarinë te Stafi ose Orari që të shihen edhe kërkesat e tij në aplikacion.</p>';
  return h+'</div>';
}
let emails={},delArm=null,delErr="",delMsg="";
async function loadEmails(){try{const r=await sb.rpc("admin_user_emails");if(!r.error){emails=Object.fromEntries((r.data||[]).map(x=>[x.id,x]));if(tab=="staff")draw()}}catch(e){}}
function accCard(){
  const L=profs.slice().sort((a,b)=>({pending:0,approved:1,rejected:2}[a.status]-{pending:0,approved:1,rejected:2}[b.status])||a.full_name.localeCompare(b.full_name));
  const stB=s=>s=="approved"?'<span class="badge o">Aktiv</span>':s=="pending"?'<span class="badge w">Në pritje</span>':'<span class="badge r">Refuzuar</span>';
  let h='<div class="card">'+togH("acc","Llogaritë e përdoruesve",L.length);
  if(!openS.acc)return h+'</div>';
  if(delMsg)h+='<div class="info" style="margin:0 0 10px"><span>'+esc(delMsg)+'</span></div>';
  h+='<p class="mut" style="font-size:13px;margin:0 0 10px">Fshirja e një llogarie largon hyrjen në aplikacion dhe kërkesat e përdoruesit në aplikacion. Orari, gjendja e pushimeve nga Excel-i dhe ditët extra në orar mbeten; emri te lista e stafit thjesht shkëputet nga llogaria.</p>';
  h+='<div class="scroll"><table><tr><th>Emri</th><th>Email</th><th>Statusi</th><th>Hyrja e fundit</th><th></th></tr>'+L.map(p=>{
    const em=emails[p.id],self=p.id==session.user.id,adm=p.role=="admin",n=allAbs.filter(a=>a.user_id==p.id).length,lk=sched.people.find(x=>x.user_id==p.id);
    const act=self||adm?'<span class="mut" style="font-size:12px">'+(self?"Ju":"Admin")+'</span>':delArm==p.id?'':'<button class="btn sm" style="color:var(--bad)" onclick="delArm=\''+p.id+'\';delErr=\'\';delMsg=\'\';draw()">Fshi</button>';
    let r='<tr'+(delArm==p.id?' class="arm"':'')+'><td><div style="display:flex;align-items:center;gap:10px"><span class="av">'+esc(ini(p.full_name))+'</span><div><b>'+esc(p.full_name)+'</b><div class="mut" style="font-size:12px">'+esc(p.position||"")+(adm?' · Admin':'')+'</div></div></div></td><td class="mut" style="font-size:13px">'+(em?esc(em.email):'—')+'</td><td>'+stB(p.status)+'</td><td class="mut" style="font-size:13px">'+(em&&em.last_sign_in_at?fmt(em.last_sign_in_at.slice(0,10)):'—')+'</td><td style="text-align:right">'+act+'</td></tr>';
    if(delArm==p.id)r+='<tr class="arm"><td colspan="5"><div class="warn" style="margin:0">'+I.warn+'<span>Fshihet llogaria e <b>'+esc(p.full_name)+'</b>'+(n?' dhe kërkesat e përdoruesit në aplikacion ('+n+')':'')+(lk?'. Emri "'+esc(lk.name)+'" mbetet në listën e stafit, pa llogari':'')+'. Ky veprim nuk kthehet mbrapsht.</span></div>'+(delErr?'<p class="err">'+esc(delErr)+'</p>':'')+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn p" id="delgo" style="background:var(--bad);border-color:var(--bad)" onclick="delUser(\''+p.id+'\')">Po, fshije llogarinë</button><button class="btn" onclick="delArm=null;delErr=\'\';draw()">Anulo</button></div></td></tr>';
    return r}).join("")+'</table></div>';
  return h+'</div>';
}
async function delUser(id){
  const b=$("#delgo");if(b)b.disabled=true;
  const p=profs.find(x=>x.id==id),{error}=await sb.rpc("admin_delete_user",{p_user:id});
  if(error){delErr="Fshirja dështoi: "+error.message;draw();return}
  delArm=null;delErr="";delMsg="Llogaria e "+(p?p.full_name:"përdoruesit")+" u fshi.";
  await load();
}
function csv(){
  const qq=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  let c="Emri,Pozita,Lloji,Prej,Deri,Ditë,Orari,Statusi,Dëshmi,Shënim,Koment i adminit\n";
  allAbs.forEach(e=>{const s=profs.find(x=>x.id==e.user_id)||{};c+=[s.full_name,s.position,T[e.leave_type][0],e.from_date,e.to_date,e.days,e.shift,{pending:"Në pritje",approved:"Miratuar",rejected:"Refuzuar"}[st(e)],e.doc_path?"Po":"Jo",e.note,e.admin_comment].map(qq).join(",")+"\n"});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="pushimet-stafit-"+Y+".csv";a.click();
}
sb.auth.getSession().then(r=>{if(!r.data.session&&!session)draw()});
</script>
